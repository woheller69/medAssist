plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.seemless'
    compileSdk 35

    defaultConfig {
        applicationId "org.woheller69.medassist"
        minSdk 28
        targetSdk 35
        versionCode 11
        versionName "1.1"
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
            packagingOptions {
                jniLibs {
                    useLegacyPackaging true
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
    }

    dependenciesInfo {
        // Disable including dependency metadata when building APKs
        includeInApk = false
        // Disable including dependency metadata when building Android App Bundles
        includeInBundle = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'com.github.woheller69:SmolChatAndroidLib:V2.1'
    //implementation files('libs/smollm-release-llamacpp-0.6.0.aar')
    implementation 'io.noties.markwon:core:4.6.2'
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1")
}
